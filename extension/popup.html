<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iCreatePDF Suite</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-badge">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-title">iCreatePDF</div>
          <div class="brand-subtitle">100% Client-Side &bull; No Uploads</div>
        </div>
      </div>
      <a href="https://icreatepdf.online" target="_blank" class="web-link" title="Open in browser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </a>
    </header>

    <!-- Search Box -->
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="search-input" placeholder="Search 70+ tools (e.g. merge, compress, word)..." autofocus autocomplete="off">
      <span class="search-shortcut">/</span>
    </div>

    <!-- Category Filter Tabs -->
    <div class="category-tabs" id="category-tabs">
      <button class="tab active" data-category="all">All Tools</button>
      <button class="tab" data-category="popular">⭐ Popular</button>
      <button class="tab" data-category="convert">Convert</button>
      <button class="tab" data-category="edit">Edit &amp; Sign</button>
      <button class="tab" data-category="organize">Organize</button>
      <button class="tab" data-category="security">Security</button>
    </div>

    <!-- Tools Grid List -->
    <div class="tools-scroll-area">
      <div class="tools-grid" id="tools-grid">
        <!-- Injected via popup.js -->
      </div>
      <div class="no-results" id="no-results" style="display: none;">
        <div class="no-results-emoji">🔍</div>
        <div class="no-results-text">No matching PDF tools found</div>
      </div>
    </div>

    <!-- Footer Status -->
    <footer class="footer">
      <div class="privacy-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <span>Zero server uploads</span>
      </div>
      <a href="https://icreatepdf.online/#tools" target="_blank" class="full-studio-btn">
        Launch Full Studio &rarr;
      </a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
